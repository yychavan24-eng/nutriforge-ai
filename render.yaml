services:
  # ----------------------------------------------------
  # NutriForge AI - FastAPI Backend Service
  # ----------------------------------------------------
  - type: web
    name: nutriforge-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutriforge-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard to keep secret

  # ----------------------------------------------------
  # NutriForge AI - React + Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: nutriforge-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nutriforge-backend
          property: host

# ----------------------------------------------------
# NutriForge AI - Persistent PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: nutriforge-db
    plan: free
    region: oregon
    databaseName: nutriforge
    user: nutriforge
